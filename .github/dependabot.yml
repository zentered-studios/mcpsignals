version: 2

updates:
  # Root workspace covers packages/node and both examples - they share the
  # single root package-lock.json.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # tsup's declaration build (rollup-plugin-dts) crashes on TS 7, and the
      # root overrides pin typescript to ^5.9.0. Lift this when the dts build
      # no longer goes through rollup-plugin-dts.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The conventionalcommits preset 10.x needs conventional-changelog-writer
      # 9+, but @semantic-release/release-notes-generator still loads writer 8,
      # so the Release job fails in generateNotes. Lift this when the release
      # notes plugin depends on conventional-changelog-writer 9.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ["version-update:semver-major"]

  - package-ecosystem: uv
    directory: /packages/python
    schedule:
      interval: weekly
    groups:
      uv-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
