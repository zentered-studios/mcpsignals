name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Never let two releases compute a version from the same history at once.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # This job deliberately declares no `environment`. It is the job that decides
  # whether there is a release at all, so binding it to an approval-gated
  # environment parked a pending review on every push to main - including
  # docs-only commits that semantic-release would have skipped. The approval
  # now sits on npm-publish below, which only runs once semantic-release has
  # actually cut a tag.
  #
  # Because @semantic-release/npm is configured with npmPublish: false, this
  # job needs no npm credentials: the plugin skips its auth verification and
  # only stamps the version and packs a tarball into dist/.
  release:
    if: github.repository == 'zentered-studios/mcpsignals'
    runs-on: ubuntu-latest
    # Consumed by the publish jobs below, which must not run when the commits
    # since the last tag produced no release.
    outputs:
      released: ${{ steps.artifacts.outputs.released }}
    permissions:
      contents: write # push the release tag and create the GitHub release
      issues: write # comment on issues closed by the release
      pull-requests: write # comment on pull requests included in the release
    steps:
      # fetch-depth: 0 so semantic-release can read every tag and commit.
      # Credentials stay persisted: semantic-release pushes the tag over git.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false

      # npm 12 blocks dependency install scripts, git dependencies and remote
      # tarballs by default, which keeps `npm ci` from running third-party code.
      - run: npm install -g npm@12

      # uv is used by the @semantic-release/exec prepare step, which stamps the
      # version semantic-release computed into packages/python/pyproject.toml
      # and builds the sdist and wheel from it.
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0

      - run: npm ci
      - run: npm run build --workspace packages/node
      - run: npm test --workspace packages/node

      - run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # dist/ and packages/python/dist only exist when semantic-release decided
      # there was a release to make and its prepare steps ran. Both are produced
      # by the same prepare phase, so either both exist or semantic-release
      # exited non-zero and this job already stopped - one flag covers both.
      - name: Check whether release artifacts were built
        id: artifacts
        run: |
          if [ -n "$(ls -A dist/*.tgz 2>/dev/null)" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
            ls -l dist packages/python/dist
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
            echo "No release this run - nothing to publish."
          fi

      # Go has no registry: a packages/go/vX.Y.Z tag publishes the module, and
      # proxy.golang.org fetches it on first request. The tag shares the root
      # version and commit. Go puts major versions 2+ in the module path, so a
      # release whose major does not match go.mod's /vN suffix stops here,
      # before the tag exists: a published Go tag can never be moved.
      - name: Tag the Go module
        if: steps.artifacts.outputs.released == 'true'
        run: |
          set -euo pipefail
          root_tag=$(git tag --points-at HEAD --list 'v*')
          if ! [[ "$root_tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected exactly one vX.Y.Z tag on HEAD, found: ${root_tag:-none}" >&2
            exit 1
          fi
          major=${root_tag#v}; major=${major%%.*}
          module=$(sed -n 's/^module //p' packages/go/go.mod)
          expected=github.com/zentered-studios/mcpsignals/packages/go
          if [ "$major" -ge 2 ]; then expected="$expected/v$major"; fi
          if [ "$module" != "$expected" ]; then
            echo "Release $root_tag needs module path $expected in packages/go/go.mod, found $module" >&2
            exit 1
          fi
          # Lightweight, like semantic-release's own tag: the runner has no git identity.
          git tag "packages/go/$root_tag"
          git push origin "packages/go/$root_tag"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.artifacts.outputs.released == 'true'
        with:
          name: npm-dist
          path: dist/*.tgz
          if-no-files-found: error

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: steps.artifacts.outputs.released == 'true'
        with:
          name: python-dist
          path: packages/python/dist/
          if-no-files-found: error

  # The approval gate lives here, so a reviewer is asked exactly once per real
  # release rather than once per push to main. npm-publish is also the
  # environment registered on the npm trusted publisher, alongside this
  # workflow's filename - changing either breaks OIDC publishing.
  #
  # Ordering caveat: the git tag and the GitHub release already exist by the
  # time this runs. A failure here leaves a tagged release that is not on npm -
  # rerun this job once the cause is fixed rather than cutting a new version.
  npm-publish:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      id-token: write # OIDC for npm trusted publishing and provenance
    steps:
      # registry-url points npm at the public registry. NODE_AUTH_TOKEN is
      # deliberately never set: any token in the environment makes npm fall
      # back to the legacy token flow instead of OIDC trusted publishing.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@12

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-dist
          path: dist/

      # Publishes the exact tarball semantic-release packed, so the artifact on
      # npm matches the one the release job built and tested. Credentials are
      # deliberately absent: npm mints a short-lived OIDC token and the registry
      # verifies it against the trusted publisher registered for the package.
      - name: Publish to npm
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(dist/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            echo "Expected exactly one tarball, found ${#tarballs[@]}: ${tarballs[*]-none}" >&2
            exit 1
          fi
          # npm-package-arg parses a bare "dist/foo.tgz" as GitHub shorthand
          # (owner/repo) rather than a local path, which npm 12's git-fetch
          # block then refuses. The leading "./" forces the file resolution.
          npm publish "./${tarballs[0]}"

  # Runs in parallel with npm-publish (both depend only on release) rather than
  # chained behind it: each has its own required-reviewer gate on its
  # environment (npm-publish, pypi), so chaining them would just make one
  # approval wait on the other for no reason. Tradeoff: if one publish fails
  # or is rejected after the other has already published, the two registries
  # end up out of sync for that version - same ordering caveat as
  # npm-publish, rerun the failed job rather than cutting a new version.
  pypi:
    needs: release
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC for PyPI trusted publishing; no token is used
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-dist
          path: dist/

      # Uploads everything in dist/. Credentials are deliberately absent: the
      # action mints a short-lived OIDC token and PyPI verifies it against the
      # trusted publisher registered for the project.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
